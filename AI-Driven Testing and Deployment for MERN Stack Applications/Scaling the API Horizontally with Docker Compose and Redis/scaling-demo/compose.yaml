services:
  api1:
    build:
      context: ..
      dockerfile: scaling-demo/Dockerfile
    environment:
      JWT_SECRET: "local-scaling-demo-secret-not-for-production"
      MONGODB_URI: mongodb://localhost:27017/scaling-demo
      NODE_ENV: development
      PORT: 4000
      SCALING_DEMO: "true"
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_URL: redis://redis:6379
      INSTANCE_NAME: api1
    depends_on:
      - redis

  api2:
    build:
      context: ..
      dockerfile: scaling-demo/Dockerfile
    environment:
      JWT_SECRET: "local-scaling-demo-secret-not-for-production"
      MONGODB_URI: mongodb://localhost:27017/scaling-demo
      NODE_ENV: development
      PORT: 4000
      SCALING_DEMO: "true"
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_URL: redis://redis:6379
      INSTANCE_NAME: api2
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2